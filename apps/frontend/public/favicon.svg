<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rexial">
  <defs>
    <!-- The wordmark's gradient, pink-300 through pink-700 -->
    <linearGradient id="rexialPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="rexialSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Dark tile: the app is dark-themed, and a bare mark disappears against
       a dark browser tab. -->
  <rect width="64" height="64" rx="15" fill="#0a0a0a"/>

  <!-- Question mark: says "quiz" at a glance, and survives 16px where a
       monogram or a detailed scene turns to mush. -->
  <path fill="url(#rexialPink)" d="M29 8c-8.2 0-14.3 5.1-14.9 13h9c.4-3.1 2.7-5.1 5.9-5.1 3.3 0 5.6 2 5.6 4.9 0 2.6-1.2 4-4.5 6.2-4.1 2.6-5.9 5.4-5.6 10.1l.1 2.2h8.8v-1.7c0-2.9 1.1-4.5 4.7-6.7 4.3-2.7 6.4-6.1 6.4-10.5C44.5 13.3 38.1 8 29 8z"/>
  <circle cx="28.8" cy="47" r="5.5" fill="url(#rexialPink)"/>

  <!-- Bolt for the live, real-time half of the product. Kept in the lower
       right and clear of the mark, so both still read when the icon is
       16px wide. -->
  <path fill="url(#rexialSpark)" d="M50 34l-9 12.5h5.5L44 57l10.5-13.5H49L50 34z"/>
</svg>
